services:
  db:
    image: postgres:16-alpine
    container_name: schemasentinel-db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: schemasentinel
    ports:
      - "5434:5432"
    volumes:
      - schemasentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d schemasentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: schemasentinel-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: schemasentinel-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@db:5432/schemasentinel
      DATABASE_URL_SYNC: postgresql://sentinel:sentinel@db:5432/schemasentinel
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./samples:/samples:ro
      - ./evals:/evals:ro
    command: >
      sh -c "python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: schemasentinel-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@db:5432/schemasentinel
      DATABASE_URL_SYNC: postgresql://sentinel:sentinel@db:5432/schemasentinel
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./services/worker:/worker
      - ./samples:/samples:ro
    command: python /worker/main.py

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_KEY: ${API_KEY:-change-me-to-a-strong-secret}
    container_name: schemasentinel-web
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: ${API_KEY:-change-me-to-a-strong-secret}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  schemasentinel_pgdata:
